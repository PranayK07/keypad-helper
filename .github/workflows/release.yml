name: Build Mac download

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  mac-download:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Check controls and profiles
        run: |
          mkdir -p .cache
          swiftc -swift-version 5 -module-cache-path .cache Sources/Domain.swift Tests/main.swift -o .cache/domain-tests
          .cache/domain-tests

      - name: Build the app
        run: bash build.sh

      - name: Package the download
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          APP="dist/Keypad Companion.app"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")
          test "$RELEASE_TAG" = "v$VERSION"
          codesign --verify --strict "$APP"
          lipo "$APP/Contents/MacOS/KeypadCompanion" -verify_arch arm64
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/Keypad-Companion-macOS.zip
          unzip -t dist/Keypad-Companion-macOS.zip

      - name: Attach app and keypad setup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/Keypad-Companion-macOS.zip config/keypad-bindings.yaml
